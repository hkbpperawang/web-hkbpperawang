<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mengalihkan...</title>
    <script type="text/javascript">
        (function() {
            var currentPath = window.location.pathname.toLowerCase();
            var currentHost = window.location.hostname.toLowerCase();
            
            var targetHome = "https://hkbpperawang.org/";
            
            if (currentHost.indexOf("www.") === 0) {
                window.location.replace(targetHome);
                return;
            }

            if (currentPath.indexOf("/warta-acara") !== -1) {
                return; 
            }

            window.location.replace(targetHome);
        })();
    </script>
</head>
<body>
    <p>Sedang mengalihkan, silakan tunggu...</p>
</body>
</html>
