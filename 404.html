<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mengalihkan...</title>
    <script type="text/javascript">
        (function() {
            var path = window.location.pathname;
            var host = window.location.hostname;
            
            var cleanPath = path.toLowerCase();
            if (cleanPath.endsWith('/')) {
                cleanPath = cleanPath.slice(0, -1);
            }

            if (cleanPath === "/warta-acara") {
                window.location.replace("https://hkbpperawang.org/warta-acara");
                return;
            }

            if (host.indexOf("www.") === 0) {
                window.location.replace("https://hkbpperawang.org" + path);
                return;
            }

            window.location.replace("https://hkbpperawang.org/");
        })();
    </script>
</head>
<body>
    <p>Sedang mengalihkan ke halaman yang benar...</p>
</body>
</html>
